<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clona cartão</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="img/ladrao.webp" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <section>
      <div class="esquerda">
        <div class="cartao">
          <div class="cima">
            <div class="frente">
              <div class="bandeira">
                <img src="img/Mastercard-logo.svg.png" alt="" />
              </div>
              <div class="chip"><img src="img/chip.png" alt="" /></div>
              <div class="numero">
                <p id="numeroCartao">0000 0000 0000 0000</p>
              </div>
              <div class="nome"><p id="nomeCartao">NOME NO CARTÃO</p></div>
              <div class="validade"><p id="validadeCartao">MM/AA</p></div>
            </div>
          </div>
          <div class="baixo">
            <div class="verso">
              <div class="cvv"><p id="cvvCartao">000</p></div>
              <div class="faixa"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="direita">
        <div class="titulo">
          <h1>Veja se seu cartão vazou na internet</h1>
        </div>
        <form class="formulario">
          <label for="nome">Nome no cartão:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            placeholder="NÃO SEI QUE LÁ DA SILVA"
          />
          <label for="numero">Número do cartão:</label>
          <input
            type="text"
            id="numero"
            name="numero"
            placeholder="0000 0000 0000 0000"
          />

          <label for="validade">Data de validade:</label>
          <input
            type="text"
            id="validade"
            name="validade"
            placeholder="MM/AA"
            maxlength="5"
            oninput="formatarData(this)"
          />

          <label for="cvv">CVV:</label>
          <input type="text" id="cvv" name="cvv" placeholder="000" />

          <button class="submit" type="submit">Verificar</button>
        </form>
      </div>
    </section>
    <footer>
        <h5>Projeto de concientização sobre golpes de Phishing</h5>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
